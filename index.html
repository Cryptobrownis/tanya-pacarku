<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuis Cinta Pixel Fullscreen 🎮💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #120924;
      font-family: 'Press Start 2P', cursive;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    /* KANVAS KEMBANG API FULLSCREEN */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      pointer-events: none;
      z-index: 99;
    }

    /* SISTEM HALAMAN HALAMAN SETUP & KUIS */
    .page {
      display: none;
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 680px;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background: #23113d;
      border: 4px solid #ff0055;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
      padding: 25px 15px;
      border-radius: 12px;
      position: relative;
      z-index: 1;
    }

    .page.active {
      display: flex;
    }

    /* TAMPILAN HALAMAN SETUP (UPLOAD FOTO) */
    .setup-title {
      font-size: 0.8rem;
      color: #00ffcc;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 3px dashed #00ffcc;
      border-radius: 12px;
      padding: 25px 15px;
      width: 100%;
      background: rgba(0, 255, 204, 0.05);
      cursor: pointer;
      margin-bottom: 15px;
    }

    .upload-label {
      font-size: 0.6rem;
      color: #fff;
      line-height: 1.6;
    }

    input[type="file"] { display: none; }

    .file-name-info {
      font-size: 0.55rem;
      color: #ffd670;
      margin-bottom: 20px;
      word-break: break-all;
      display: none;
    }

    /* KUIS BOX */
    .header-box { width: 100%; }

    .progress {
      font-size: 0.6rem;
      color: #ff0055;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .question-title {
      font-size: 0.75rem;
      color: #00ffcc;
      line-height: 1.6;
      margin-bottom: 15px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-option {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      padding: 16px 12px;
      background: #351a5c;
      color: #fff;
      border: 3px solid #00ffcc;
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
      transition: transform 0.1s;
      line-height: 1.4;
      width: 100%;
      border-radius: 8px;
    }

    .btn-option:active {
      transform: scale(0.96);
      background: #ff0055;
    }

    /* POPUP MODAL PIXEL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      background: #180b30;
      border: 4px solid #fff;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
      padding: 25px 15px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border-radius: 12px;
    }

    .modal-title {
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .modal-msg {
      font-size: 0.65rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* FOTO JAWABAN SALAH */
    .wrong-photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border: 4px solid #ff0055;
      border-radius: 12px;
      margin: 10px auto 20px auto;
      display: none;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }

    /* ANIMASI ZOOM OUT -> ZOOM IN */
    @keyframes zoomOutZoomIn {
      0% {
        transform: scale(0.1);
        opacity: 0;
      }
      50% {
        transform: scale(1.35);
        opacity: 1;
      }
      75% {
        transform: scale(0.85);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animated-wrong-photo {
      animation: zoomOutZoomIn 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .btn-next {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      padding: 14px 20px;
      background: #00ffcc;
      color: #000;
      border: 3px solid #fff;
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
      width: 100%;
      border-radius: 8px;
    }

    .btn-next:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      border-color: #666;
      box-shadow: none;
    }

    .btn-next:active:not(:disabled) {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <canvas id="fireworksCanvas"></canvas>

  <!-- HALAMAN 1: UPLOAD FOTO JAWABAN SALAH -->
  <div class="page active" id="setupPage">
    <div class="setup-title">SIAPKAN KUIS CINTA 📸💖</div>
    
    <div class="upload-box" onclick="document.getElementById('photoInput').click()">
      <div class="upload-label" id="uploadLabel">📁 Klik di sini untuk upload foto khusus (Jawaban Salah)</div>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="file-name-info" id="fileNameInfo">📄 File: <span id="fileNameText"></span></div>

    <button class="btn-next" id="startBtn" disabled onclick="startQuiz()">MULAI KUIS ➔</button>
  </div>

  <!-- HALAMAN 2: LAYAR KUIS -->
  <div class="page" id="quizPage">
    <div class="header-box">
      <div class="progress" id="progressText">SOAL 1 DARI 6</div>
      <div class="question-title" id="questionText">Loading...</div>
    </div>
    <div class="options-grid" id="optionsContainer"></div>
  </div>

  <!-- POPUP RESPONSE -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">BENAR!</div>
      <img id="wrongPhotoImg" class="wrong-photo" alt="Foto Jawaban Salah">
      <div class="modal-msg" id="modalMsg">Kata romantis...</div>
      <button class="btn-next" onclick="closeModal()">LANJUT ➔</button>
    </div>
  </div>

  <script>
    let uploadedPhotoSrc = null;

    const photoInput = document.getElementById('photoInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const fileNameInfo = document.getElementById('fileNameInfo');
    const fileNameText = document.getElementById('fileNameText');
    const startBtn = document.getElementById('startBtn');
    const wrongPhotoImg = document.getElementById('wrongPhotoImg');

    // Menerima upload foto jawaban salah
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      fileNameText.innerText = file.name;
      fileNameInfo.style.display = 'block';
      uploadLabel.innerText = "📁 Klik jika ingin mengganti foto";

      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedPhotoSrc = event.target.result;
        wrongPhotoImg.src = uploadedPhotoSrc;
        startBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });

    function startQuiz() {
      document.getElementById('setupPage').classList.remove('active');
      document.getElementById('quizPage').classList.add('active');
      loadQuestion();
    }

    const questions = [
      {
        q: "1. Kapan tanggal jadian resmi kita?",
        options: ["12 Oktober", "14 Februari", "25 Desember"],
        correct: 0,
        romanticMsg: "Inget tanggal jadian aja udah bikin makin sayang! Kamu emang pacar terbaik! 💖✨"
      },
      {
        q: "2. Makanan favorit aku kalau lagi ngambek?",
        options: ["Bakso Pedas", "Seblak", "Es Krim Cokelat"],
        correct: 2,
        romanticMsg: "Paham banget cara bikin aku seneng lagi. Kamu jawaban dari segala rasa manisku! 🍦💕"
      },
      {
        q: "3. Tempat pertama kali kita kencan?",
        options: ["Bioskop", "Taman Kota", "Kedai Kopi"],
        correct: 2,
        romanticMsg: "Kopi hari itu pahit, tapi tatapan mata kamu bikin semuanya terasa manis banget! ☕💖"
      },
      {
        q: "4. Siapa yang paling sering ngaku kangen duluan?",
        options: ["Aku dong!", "Kamu lah!", "Dua-duanya sama aja"],
        correct: 1,
        romanticMsg: "Soalnya rasa kangen aku ke kamu itu gak ada habisnya tiap detik! 😘💗"
      },
      {
        q: "5. Kebiasaan aku kalau mau tidur apa hayo?",
        options: ["Main Game", "Cari Alasan Telponan", "Dengerin Lagu"],
        correct: 1,
        romanticMsg: "Suara kamu itu lagu pengantar tidur paling merdu di dunia tahu! 💤💘"
      },
      {
        q: "6. Pertanyaan terakhir, kamu sayang banget gak sama aku?",
        options: ["Sayang banget!", "Biasa aja sih", "Gak sayang sama sekali"],
        correct: 0,
        romanticMsg: "Aku juga sayang bangeeeet sama kamu! Makasih udah jawab semua dengan benar! 💍💖🎉"
      }
    ];

    let currentQ = 0;

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressText = document.getElementById('progressText');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMsg = document.getElementById('modalMsg');

    function loadQuestion() {
      const q = questions[currentQ];
      progressText.innerText = `SOAL ${currentQ + 1} DARI ${questions.length}`;
      questionText.innerText = q.q;
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx) {
      const q = questions[currentQ];
      if (selectedIdx === q.correct) {
        // JAWABAN BENAR
        modalTitle.innerText = "BENAR! 💖";
        modalTitle.style.color = "#00ffcc";
        modalMsg.innerText = q.romanticMsg;
        wrongPhotoImg.style.display = "none";
        wrongPhotoImg.classList.remove('animated-wrong-photo');
        triggerHeartFireworks();
      } else {
        // JAWABAN SALAH (MENAMPILKAN FOTO DENGAN ANIMASI ZOOM)
        modalTitle.innerText = "SALAH NGGAK YA! 😜";
        modalTitle.style.color = "#ff0055";
        modalMsg.innerText = "Parah banget sih salah! Muka kamu/aku pas lagi ngambek meluncur khusus buat kamu!";
        
        wrongPhotoImg.style.display = "block";
        wrongPhotoImg.classList.remove('animated-wrong-photo');
        void wrongPhotoImg.offsetWidth; // Trigger Reflow
        wrongPhotoImg.classList.add('animated-wrong-photo');
      }
      modalOverlay.style.display = "flex";
    }

    function closeModal() {
      modalOverlay.style.display = "none";
      if (modalTitle.innerText.includes("BENAR")) {
        currentQ++;
        if (currentQ < questions.length) {
          loadQuestion();
        } else {
          progressText.innerText = "KUIS SELESAI!";
          questionText.innerText = "Selamat sayang! Kamu udah menyelesaikan semua pertanyaan dengan sempurna! I Love You! 💌🎉";
          optionsContainer.innerHTML = `<button class="btn-option" onclick="location.reload()">MAIN LAGI 🔄</button>`;
        }
      }
    }

    // SYSTEM KEMBANG API BENTUK HATI
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerHeartFireworks() {
      particles = [];
      const centerX = fwCanvas.width / 2;
      const centerY = fwCanvas.height / 2.5;

      for (let i = 0; i < 180; i++) {
        const t = (Math.PI / 90) * i;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        particles.push({
          x: centerX,
          y: centerY,
          vx: x * (Math.random() * 0.4 + 0.6),
          vy: y * (Math.random() * 0.4 + 0.6),
          size: Math.floor(Math.random() * 5 + 4),
          color: ['#ff0055', '#ff6699', '#ff3300', '#00ffcc', '#ffffff'][Math.floor(Math.random() * 5)],
          alpha: 1,
          life: 0.015
        });
      }
    }

    function updateParticles() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.alpha -= p.life;

        if (p.alpha <= 0) {
          particles.splice(idx, 1);
        } else {
          fwCtx.globalAlpha = p.alpha;
          fwCtx.fillStyle = p.color;
          fwCtx.fillRect(p.x, p.y, p.size, p.size);
        }
      });

      requestAnimationFrame(updateParticles);
    }
    updateParticles();
  </script>
</body>
</html>
